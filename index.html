<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FBF7F1">
<title>Dispensa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div>
    <h1>Dispensa</h1>
    <div id="sub">Cosa manca in casa</div>
  </div>
  <div class="top-r">
    <span id="sync" class="sync" title="Sincronizzazione"></span>
    <button id="btn-refresh" class="icon-btn" aria-label="Aggiorna">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btn-set" class="icon-btn" aria-label="Impostazioni">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <ul id="list"></ul>
  <div id="empty" class="hidden">
    <div class="empty-ic">
      <svg viewBox="0 0 64 64"><rect x="12" y="20" width="40" height="34" rx="6" fill="#F1E3CC"/><path d="M20 20v-4a12 12 0 0 1 24 0v4" fill="none" stroke="#D39A2C" stroke-width="4" stroke-linecap="round"/><path d="M24 38l6 6 11-12" fill="none" stroke="#6B9A4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <p>Non manca niente.</p>
    <p class="muted">Scrivi qui sotto quello che finisce.</p>
  </div>
</main>

<form id="add" autocomplete="off">
  <div id="sugg"></div>
  <div class="add-row">
    <input id="inp" type="text" placeholder="Cosa manca? (es. latte, uova)" enterkeyhint="done" maxlength="80">
    <button id="btn-add" type="submit" aria-label="Aggiungi">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </div>
</form>

<div id="sheet" class="hidden" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
<div id="toast" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
